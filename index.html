<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Selah Bible | Deep Insight Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    screens: {
                        'xs': '375px',
                        'sm': '640px',
                        'md': '768px',
                        'lg': '1024px',
                        'xl': '1280px',
                        '2xl': '1536px',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 safe-top safe-bottom">

    <div class="aurora-bg"></div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Authors Modal -->
    <div id="authorsModal" class="authors-modal" onclick="closeAuthorsModal(event)">
        <div class="authors-content" onclick="event.stopPropagation()">
            <div class="mb-4 text-4xl text-indigo-500">
                <i class="fas fa-users"></i>
            </div>
            <h3 class="text-xl font-bold mb-4 display-font">Created By</h3>
            <div class="space-y-2 text-lg">
                <p class="font-semibold">Stephen Semense</p>
                <p class="font-semibold">Yojan Christ Barnes</p>
            </div>
            <button onclick="closeAuthorsModal()" class="mt-6 px-6 py-2 bg-indigo-500 text-white rounded-full hover:bg-indigo-600 transition-colors">
                Close
            </button>
        </div>
    </div>

    <!-- Cover Modal -->
    <div id="coverModal" class="cover-modal" onclick="closeCoverModal(event)">
        <div class="cover-modal-content" onclick="event.stopPropagation()">
            <button class="cover-modal-close" onclick="closeCoverModal()" aria-label="Close modal">
                <i class="fas fa-times"></i>
            </button>
            <div class="cover-modal-image-wrapper">
                <div id="modalFallback" class="cover-modal-image-fallback"></div>
                <img id="modalCoverImage" src="" alt="" class="cover-modal-image" width="400" height="600">
            </div>
            <div class="cover-modal-info">
                <h2 id="modalBookTitle" class="cover-modal-title"></h2>
                <p id="modalBookInfo" class="cover-modal-subtitle"></p>
                <p id="modalBookTagline" class="cover-modal-tagline"></p>
                <div class="cover-modal-actions">
                    <button id="modalReadBtn" class="cover-modal-btn primary">
                        <i class="fas fa-book-open"></i> Read Now
                    </button>
                    <button class="cover-modal-btn secondary" onclick="closeCoverModal()">
                        <i class="fas fa-times"></i> Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 glass-card border-b border-slate-200/50 dark:border-slate-800/50 px-4 py-3 sm:px-6 sm:py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <h1 class="text-xl sm:text-2xl font-bold tracking-tighter cursor-pointer display-font no-select" onclick="resetToLibrary()">SELAH</h1>
            
            <div class="flex-grow max-w-md relative mx-4">
                <i class="fas fa-search absolute left-3 sm:left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="globalSearch" placeholder="Search Bible (e.g. John 3:16)..." 
                    class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-transparent focus:border-indigo-500/50 rounded-xl sm:rounded-2xl py-2 pl-9 sm:pl-10 pr-3 sm:pr-4 text-sm outline-none transition-all"
                    onkeypress="if(event.key === 'Enter') handleSearch(this.value)">
            </div>
            
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="resetToLibrary()" class="p-2.5 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg sm:rounded-xl transition-colors" title="Home" aria-label="Home">
                    <i class="fas fa-house text-slate-500 dark:text-slate-400 text-sm sm:text-base"></i>
                </button>
                <button onclick="toggleDarkMode()" class="p-2.5 hover:rotate-12 transition-transform" aria-label="Toggle dark mode">
                    <i id="themeIcon" class="fas fa-moon text-slate-500 text-sm sm:text-base"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Progress Bar -->
    <div id="progressContainer" class="hidden sticky top-[57px] sm:top-[73px] z-40 w-full h-1 bg-slate-200 dark:bg-slate-800">
        <div id="progressBar" class="h-full bg-indigo-500 transition-all duration-300" style="width: 0%"></div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-4 sm:px-6 sm:py-6 md:px-8 md:py-8 lg:px-12 relative z-10">
        
        <!-- Selection Flow -->
        <div id="selectionFlow" class="mb-4 sm:mb-8 hidden flex items-center justify-center gap-1 sm:gap-2 text-slate-400">
            <span id="step1" class="step-pill">1. Book</span>
            <i class="fas fa-chevron-right text-[6px] sm:text-[8px]"></i>
            <span id="step2" class="step-pill">2. Chapter</span>
        </div>

        <div id="viewContainer">
            <!-- Library View -->
            <div id="libraryView">
                <!-- Verse of the Day -->
                <div class="mb-6 sm:mb-10">
                    <h2 class="text-[10px] sm:text-xs font-black text-indigo-500 uppercase tracking-widest mb-2 sm:mb-4">Verse of the Day</h2>
                    <div class="glass-card rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 border border-indigo-100 dark:border-indigo-900/30">
                        <p id="votdText" class="text-base sm:text-xl md:text-2xl font-serif italic mb-3 sm:mb-4 leading-relaxed">"Thy word is a lamp unto my feet..."</p>
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <span id="votdRef" class="font-bold text-indigo-500 cursor-pointer hover:underline text-sm sm:text-base" onclick="openVotd()">Psalm 119:105</span>
                            <button id="votdExplainBtn" class="bg-indigo-500/10 text-indigo-500 px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg sm:rounded-xl text-[10px] sm:text-xs font-bold flex items-center gap-1.5 sm:gap-2 hover:bg-indigo-500 hover:text-white transition-all">
                                <i class="fas fa-lightbulb"></i> <span class="hidden sm:inline">Explain</span><span class="sm:hidden">AI</span>
                            </button>
                        </div>
                        <div id="votd-insight" class="insight-panel bg-white/50 dark:bg-slate-900/50 rounded-xl sm:rounded-2xl p-4 sm:p-6 mt-3 sm:mt-4"></div>
                    </div>
                </div>

                <!-- Reading Progress Section -->
                <div id="progressSection" class="mb-6 sm:mb-10 hidden">
                    <div class="flex items-center justify-between mb-2 sm:mb-4">
                        <h2 class="text-[10px] sm:text-xs font-black text-indigo-500 uppercase tracking-widest">Your Reading Progress</h2>
                        <button onclick="clearAllProgress()" class="text-[10px] text-slate-400 hover:text-red-500 transition-colors p-2" title="Reset all progress">
                            <i class="fas fa-trash-alt"></i> <span class="hidden sm:inline">Reset</span>
                        </button>
                    </div>
                    <div id="progressGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2 sm:gap-3"></div>
                </div>

                <!-- Continue Reading Section -->
                <div id="historySection" class="mb-6 sm:mb-10 hidden">
                    <h2 class="text-[10px] sm:text-xs font-black text-indigo-500 uppercase tracking-widest mb-2 sm:mb-4">Continue Reading</h2>
                    <div id="historyGrid" class="flex gap-2 sm:gap-4 overflow-x-auto pb-3 sm:pb-4 custom-scrollbar snap-x"></div>
                </div>

                <!-- Old Testament Section -->
                <div class="testament-divider">
                    <span class="testament-title">Old Testament</span>
                </div>
                <div id="otGrid" class="books-grid mb-6 sm:mb-10"></div>

                <!-- New Testament Section -->
                <div class="testament-divider">
                    <span class="testament-title">New Testament</span>
                </div>
                <div id="ntGrid" class="books-grid"></div>

                <!-- Footer with Authors -->
                <div class="mt-16 mb-8 text-center">
                    <button onclick="showAuthorsModal()" class="text-xs text-slate-400 hover:text-indigo-500 transition-colors flex items-center gap-2 mx-auto">
                        <i class="fas fa-info-circle"></i>
                        <span>About the Creators</span>
                    </button>
                    <p class="text-[10px] text-slate-300 mt-2">© 2026 Selah Bible. All rights reserved.</p>
                </div>
            </div>

            <!-- Selection View -->
            <div id="selectionView" class="hidden">
                <div class="flex items-center gap-3 sm:gap-4 mb-4 sm:mb-8">
                    <div id="selectionBookCover" class="w-16 h-24 sm:w-24 sm:h-36 rounded-lg shadow-lg flex-shrink-0 overflow-hidden"></div>
                    <div class="min-w-0">
                        <h2 id="selectionTitle" class="text-xl sm:text-3xl font-bold display-font truncate"></h2>
                        <p class="text-slate-500 dark:text-slate-400 mt-1 text-sm sm:text-base">Select a chapter to begin reading</p>
                    </div>
                </div>
                <div id="selectionGrid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2 sm:gap-3"></div>
            </div>

            <!-- Reader View -->
            <div id="readerView" class="hidden max-w-4xl mx-auto">
                <!-- Navigation Controls -->
                <div class="flex items-center justify-between mb-4 sm:mb-6 gap-2">
                    <button onclick="navChapter(-1)" class="p-2 sm:p-3 glass-card rounded-lg sm:rounded-xl hover:bg-indigo-500 hover:text-white transition-all disabled:opacity-30 disabled:cursor-not-allowed" id="prevChapterBtn" aria-label="Previous chapter">
                        <i class="fas fa-chevron-left text-sm sm:text-base"></i>
                    </button>
                    
                    <select id="chapterJumpDropdown" onchange="jumpToChapter(this.value)" class="glass-card px-3 sm:px-4 py-2 rounded-lg sm:rounded-xl text-xs sm:text-sm font-black uppercase outline-none bg-transparent cursor-pointer dark:text-white min-w-0 flex-shrink">
                    </select>
                    
                    <button onclick="navChapter(1)" class="p-2 sm:p-3 glass-card rounded-lg sm:rounded-xl hover:bg-indigo-500 hover:text-white transition-all disabled:opacity-30 disabled:cursor-not-allowed" id="nextChapterBtn" aria-label="Next chapter">
                        <i class="fas fa-chevron-right text-sm sm:text-base"></i>
                    </button>
                </div>

                <!-- Reader Header -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-4 sm:mb-8 border-b dark:border-slate-800 pb-4 gap-3 sm:gap-4">
                    <div class="w-full">
                        <h2 id="readerTitle" class="text-2xl sm:text-3xl md:text-4xl font-serif font-bold display-font mb-3 sm:mb-4"></h2>
                        
                        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                            <select id="verseDropdown" onchange="jumpToVerse(this.value)" class="glass-card px-3 sm:px-4 py-2 rounded-lg sm:rounded-xl text-xs font-bold outline-none bg-transparent dark:text-white">
                                <option value="">Jump Verse</option>
                            </select>
                            
                            <select id="audioSpeed" class="glass-card px-3 sm:px-4 py-2 rounded-lg sm:rounded-xl text-xs font-bold outline-none bg-transparent dark:text-white">
                                <option value="0.5">0.5x</option>
                                <option value="0.8">0.8x</option>
                                <option value="1.0" selected>1.0x</option>
                                <option value="1.2">1.2x</option>
                                <option value="1.5">1.5x</option>
                                <option value="2.0">2.0x</option>
                            </select>

                            <div class="flex gap-1.5 sm:gap-2 w-full sm:w-auto">
                                <button id="btn-read-all" onclick="readFullChapter()" class="glass-card px-3 sm:px-4 py-2 rounded-lg sm:rounded-xl text-[10px] sm:text-xs font-black uppercase flex items-center gap-1.5 sm:gap-2 hover:bg-indigo-500 hover:text-white transition-all ring-2 ring-indigo-500/20 flex-1 sm:flex-none justify-center">
                                    <i class="fas fa-play"></i> <span id="read-all-text">Read All</span>
                                </button>
                                
                                <button id="btn-restart-audio" onclick="restartReading()" class="glass-card px-3 sm:px-4 py-2 rounded-lg sm:rounded-xl text-[10px] sm:text-xs font-black uppercase flex items-center gap-1.5 sm:gap-2 hover:bg-slate-500 hover:text-white transition-all hidden flex-1 sm:flex-none justify-center">
                                    <i class="fas fa-redo"></i> <span class="hidden sm:inline">Restart</span>
                                </button>

                                <button id="btn-stop-all" onclick="stopAudio()" class="glass-card px-3 sm:px-4 py-2 rounded-lg sm:rounded-xl text-[10px] sm:text-xs font-black uppercase flex items-center gap-1.5 sm:gap-2 hover:bg-red-500 hover:text-white transition-all hidden flex-1 sm:flex-none justify-center">
                                    <i class="fas fa-stop"></i> <span class="hidden sm:inline">Stop</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Verses List -->
                <div id="verseList" class="reading-text space-y-6 sm:space-y-8 md:space-y-12 pb-10"></div>

                <!-- Bottom Navigation -->
                <div class="flex items-center justify-between mt-8 sm:mt-10 pb-12 sm:pb-20 border-t dark:border-slate-800 pt-6 sm:pt-8 gap-2">
                    <button onclick="navChapter(-1)" class="flex items-center gap-2 sm:gap-3 px-4 sm:px-6 py-3 sm:py-4 glass-card rounded-xl sm:rounded-2xl hover:bg-indigo-500 hover:text-white transition-all group flex-1 sm:flex-none justify-center sm:justify-start">
                        <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform text-sm sm:text-base"></i>
                        <div class="text-left">
                            <p class="text-[9px] sm:text-[10px] uppercase opacity-50 font-bold">Previous</p>
                            <p class="text-xs sm:text-sm font-bold">Chapter</p>
                        </div>
                    </button>
                    <button onclick="navChapter(1)" class="flex items-center gap-2 sm:gap-3 px-4 sm:px-6 py-3 sm:py-4 glass-card rounded-xl sm:rounded-2xl hover:bg-indigo-500 hover:text-white transition-all group flex-1 sm:flex-none justify-center sm:justify-end">
                        <div class="text-right">
                            <p class="text-[9px] sm:text-[10px] uppercase opacity-50 font-bold">Next</p>
                            <p class="text-xs sm:text-sm font-bold">Chapter</p>
                        </div>
                        <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform text-sm sm:text-base"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
</body>
</html>
